documentationUrl: https://docs.airbyte.com/integrations/sources/customer-thermometer
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: CustomerThermometer API Source Spec
  type: object
  required:
    - api_key
    - start_date
  additionalProperties: true
  properties:
    api_key:
      type: string
      title: API Key
      description: >
        CustomerThermometer API key. Found in the CT admin panel under
        Account Settings > API. Stored as THERMOM_API_KEY in .env.
      airbyte_secret: true
      order: 0
    start_date:
      type: string
      title: Start Date
      description: >
        ISO 8601 date (YYYY-MM-DD). On the first sync the connector walks
        forward from this date in 7-day chunks until today, fetching every
        response in the range. The CustomerThermometer API caps each call
        at 10,000 records and does not support pagination; a 7-day window
        keeps each call well under that for any realistic response volume,
        so an arbitrarily-old start_date is safe. Set it to whenever your
        CT account first started receiving responses.

        Changing start_date AFTER a successful sync has no effect on its
        own — the stream's saved cursor takes precedence, and the cursor
        can only advance forward. To re-fetch responses older than the
        current cursor, "Clear data" on the stream in the Airbyte UI
        (which resets the cursor), set the earlier start_date, then run a
        fresh sync. Downstream incremental models keyed on response_id
        will MERGE the retroactive rows in cleanly with no manual dbt
        intervention.
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      examples:
        - "2025-07-01"
      order: 1
