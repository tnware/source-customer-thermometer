[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "source-customer-thermometer"
version = "0.4.0"
description = "Airbyte source connector for the CustomerThermometer API"
requires-python = ">=3.10"
dependencies = [
    "airbyte-cdk>=3.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
]

[project.scripts]
source-customer-thermometer = "source_customer_thermometer.__main__:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["source_customer_thermometer*"]

[tool.setuptools.package-data]
"source_customer_thermometer" = ["spec.yaml", "schemas/*.json"]
