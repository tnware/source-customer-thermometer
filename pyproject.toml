[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "source-ct-api"
version = "0.3.0"
description = "Airbyte source connector for the CustomerThermometer API"
requires-python = ">=3.10"
dependencies = [
    "airbyte-cdk>=3.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
]

[project.scripts]
source-ct-api = "source_ct_api.__main__:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["source_ct_api*"]

[tool.setuptools.package-data]
"source_ct_api" = ["spec.yaml", "schemas/*.json"]
